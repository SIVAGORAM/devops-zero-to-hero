apiVersion: v1
kind: Pod
metadata:
  name: db-pod-required
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: "role"
                operator: In
                values:
                  - database
  containers:
    - name: db-container
      image: mysql
