apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: demodaemonset
  namespace: default
  labels:
    env: demo
spec:
  selector:
    matchLabels:
      env: demo
  template:
    metadata:
      labels:
        env: demo
    spec:
      containers:
        - name: demoset
          image: ubuntu
          command: ["/bin/bash", "-c", "while true; do echo Hello-Devops; sleep 8; done"]
