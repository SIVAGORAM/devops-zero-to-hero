apiVersion: v1
kind: Pod
metadata:
  name: myvolconfig
spec:
  containers:
    - name: c1
      image: centos
      command: ["/bin/bash", "-c", "while true; do echo Hello-devops; sleep 5 ; done"]
      volumeMounts:
        - name: testconfigmap
          mountPath: /etc/config
  volumes:
    - name: testconfigmap
      configMap:
        name: myconfig
        items:
          - key: sample.conf
            path: sample.conf
