apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "200Mi"
              cpu: "200m"

          livenessProbe:
            initialDelaySeconds: 2
            periodSeconds: 5
            httpGet:
              path: /
              port: 80

          readinessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: /
              port: 80

          volumeMounts:
            # Mount your PV/PVC, Secret, or ConfigMap here
            # Example:
            # - name: ebs-volume
            #   mountPath: /usr/share/nginx/html

      volumes:
        # Connect your PV/PVC, Secret, or ConfigMap here
        # Example:
        # - name: ebs-volume
        #   persistentVolumeClaim:
        #     claimName: myebs-pvc
