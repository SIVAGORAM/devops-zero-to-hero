# Stable Deployment (Canary Base)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-stable
spec:
  replicas: 4  # Set more replicas for the stable version
  selector:
    matchLabels:
      app: myapp-canary # Both deployments share the same core label
      version: stable
  template:
    metadata:
      labels:
        app: myapp-canary
        version: stable
    spec:
      containers:
        - name: myapp
          image: sachinquamtumcloud/webpage:v1  # Stable version of the app
          ports:
            - containerPort: 80
