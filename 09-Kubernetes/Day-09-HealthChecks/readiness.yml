apiVersion: v1
kind: Pod
metadata:
  labels:
    test: readiness
  name: myreadinessprobe
spec:
  containers:
    - name: c00
      image: httpd
      ports:
        - containerPort: 80

      # Readiness probe checks whether the container is ready
      # to receive traffic
      readinessProbe:
        # Wait 5 seconds before running the first probe
        initialDelaySeconds: 5

        # Run the probe every 5 seconds
        periodSeconds: 5

        # HTTP endpoint to check inside the container
        httpGet:
          path: /
          port: 80
