apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-page
spec:
  replicas: 4
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: web-page
          image: nginx:latest
          ports:
            - containerPort: 80
